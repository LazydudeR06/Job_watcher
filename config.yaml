sources:
  remotive:
    enabled: true
    feed_url: https://remotive.com/api/remote-jobs
  remoteok:
    enabled: true
    feed_url: https://remoteok.com/api
  himalayas:
    enabled: true
    feed_url: https://himalayas.app/jobs/api?limit=20
  adzuna:
    enabled: false
    app_id_env: ADZUNA_APP_ID
    app_key_env: ADZUNA_APP_KEY
    country: in
    results_per_page: 50
  linkedin:
    enabled: false
    imap_host_env: LINKEDIN_IMAP_HOST
    username_env: LINKEDIN_IMAP_USERNAME
    password_env: LINKEDIN_IMAP_PASSWORD
    folder: INBOX
    sender: jobalerts-noreply@linkedin.com
  linkedin_email:
    enabled: false
    imap_host: imap.gmail.com
    folder: INBOX
    sender_filter: jobalerts-noreply@linkedin.com
    max_emails_per_run: 50
    lookback_days: 3

outbound:
  enabled: false
  discord_webhook_env: DISCORD_WEBHOOK_URL

reports:
  digest_min_score: 60

notifications:
  notification_min_score: 75

watcher:
  interval_seconds: 3600

embeddings:
  backend: ollama
  model: nomic-embed-text
  ollama_url: http://localhost:11434
  similarity_threshold: 0.35

scoring:
  backend: ollama
  model: llama3.2:3b
  ollama_url: http://localhost:11434
  timeout_seconds: 60
